name: Tests

# A PR runs the static checks and the quick tier. The merge queue, and any
# push to master, run everything but the slow fits across four shards. Pushes
# to a PR's branch run through pull_request alone, not twice.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:

# A new push cancels the branch's run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install poetry
        uses: snok/install-poetry@v1

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      # Static gate: ruff format, ruff check, pylint --errors-only, mypy.
      # The pre-push hooks run the same recipes on the pushed files only.
      - name: Static checks
        run: just check

  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install poetry
        uses: snok/install-poetry@v1

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      # Fits over ten seconds are marked long and wait for the merge queue.
      - name: Run quick tests
        run: just test -m "not slow and not long"

  shard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        group: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install poetry
        uses: snok/install-poetry@v1

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      # Fits over a minute are marked slow and run only locally. pytest-split
      # balances the groups by .test_durations, which `just durations` renews.
      - name: Run tests
        run: just test -m "not slow" --splits 4 --group ${{ matrix.group }}

  # The one required test check. A skipped matrix job reports under its
  # unexpanded name, so the shards cannot be required by name on a PR.
  tests:
    if: ${{ !cancelled() }}
    needs: [quick, shard]
    runs-on: ubuntu-latest

    steps:
      - name: Require that no test job failed or was cancelled
        run: |
          echo "quick: ${{ needs.quick.result }}, shard: ${{ needs.shard.result }}"
          [[ "${{ needs.quick.result }}" =~ ^(success|skipped)$ ]]
          [[ "${{ needs.shard.result }}" =~ ^(success|skipped)$ ]]
