name: Tests

# Pushes to a PR's branch run through pull_request alone, not twice.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# A new push cancels the branch's run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install poetry
        uses: snok/install-poetry@v1

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      # Static gate: ruff format, ruff check, pylint --errors-only, mypy.
      # The pre-push hooks run the same recipes on the pushed files only.
      - name: Static checks
        run: just check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        group: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install poetry
        uses: snok/install-poetry@v1

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      # Fits over a minute are marked slow and run only locally. pytest-split
      # balances the groups by .test_durations, which `just durations` renews.
      - name: Run tests
        run: just test -m "not slow" --splits 4 --group ${{ matrix.group }}
