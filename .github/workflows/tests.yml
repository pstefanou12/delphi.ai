name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install poetry
        uses: snok/install-poetry@v1

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: just install

      # Static gate: ruff format, ruff check, pylint --errors-only, mypy.
      # Identical to the pre-push hooks and to `just check` locally.
      - name: Static checks
        run: just check

      - name: Run tests
        run: just test
