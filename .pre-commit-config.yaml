# Author: pstefanou12@
# Every hook delegates to a just recipe, which in turn goes through poetry,
# so there is no second, separately-pinned copy of the linters. Each checks
# only the pushed Python files under delphi/; CI runs `just check` on all.

default_stages: [pre-push]

repos:
  - repo: local
    hooks:
      - id: fmt-check
        name: just fmt-check
        entry: just fmt-check
        language: system
        types: [python]
        files: ^delphi/

      - id: lint-check
        name: just lint-check
        entry: just lint-check
        language: system
        types: [python]
        files: ^delphi/

      - id: pylint
        name: just pylint
        entry: just pylint
        language: system
        types: [python]
        files: ^delphi/

      - id: typecheck
        name: just typecheck
        entry: just typecheck
        language: system
        types: [python]
        files: ^delphi/
