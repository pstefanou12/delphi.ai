[tool.poetry]
name = "delphi-ai"
version = "0.2.1.9"
description = "Package for Robust Statistics"
authors = ["Patroklos Stefanou <patstefanou@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/pstefanou12/delphi"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
packages = [{ include = "delphi" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
cox = "*"
dill = "*"
GPUtil = "*"
gitpython = "*"
matplotlib = "*"
numpy = "*"
pandas = "*"
py3nvml = "*"
pydantic = ">=2.0"
# TODO: pstefanou12@ - scikit-learn 1.8 removed the multi_class kwarg that
# stats/truncated_logistic_regression.py passes. Unpin once that OvR path is
# ported to OneVsRestClassifier.
scikit-learn = "<1.8"
scipy = "*"
seaborn = "*"
statsmodels = "*"
tables = "*"
tensorboardX = "*"
# Floors, not cosmetics: with torch unpinned the resolver backtracks to
# 2.7.1 for python >= 3.14, which ships no cp314 wheel and no sdist, so
# `poetry install` cannot satisfy it at all. See also the "!=3.14.1"
# requires_python that networkx and torchvision declare, which is what
# makes Poetry split the graph at 3.14 in the first place.
torch = ">=2.10"
torchvision = ">=0.25"
tqdm = "*"

[tool.poetry.group.dev.dependencies]
ipdb = "*"
mypy = "*"
pre-commit = "*"
pylint = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint]
# Default rules plus I (isort): import grouping and ordering, which CLAUDE.md
# specifies but nothing enforced.
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["delphi"]
# Sort each section by module name alone, interleaving `import x` and
# `from x import y`, per the convention in CLAUDE.md.
force-sort-within-sections = true

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# TODO: pstefanou12@ - revisit the generic/config typing of
# TruncatedExponentialFamilyDistribution, then drop this. configs._ConfigT is
# bound to TrainerConfig while this module reads fields declared only on
# TruncatedExponentialFamilyDistributionConfig (num_samples, eps, batch_size,
# min_radius, max_phases, rate, max_radius, project).
module = "delphi.truncated.distributions.truncated_exponential_family_distributions"
ignore_errors = true
