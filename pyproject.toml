[tool.poetry]
name = "delphi-ai"
version = "0.2.1.9"
description = "Package for Robust Statistics"
authors = ["Patroklos Stefanou <patstefanou@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/pstefanou12/delphi"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
packages = [{ include = "delphi" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
cox = "*"
dill = "*"
GPUtil = "*"
gitpython = "*"
matplotlib = "*"
numpy = "*"
pandas = "*"
py3nvml = "*"
pydantic = ">=2.0"
# TODO: pstefanou12@ - scikit-learn 1.8 removed the multi_class kwarg that
# stats/truncated_logistic_regression.py passes. Unpin once that OvR path is
# ported to OneVsRestClassifier.
scikit-learn = "<1.8"
scipy = "*"
seaborn = "*"
statsmodels = "*"
tables = "*"
tensorboardX = "*"
# Floors, not cosmetics: with torch unpinned the resolver backtracks to
# 2.7.1 for python >= 3.14, which ships no cp314 wheel and no sdist, so
# `poetry install` cannot satisfy it at all. See also the "!=3.14.1"
# requires_python that networkx and torchvision declare, which is what
# makes Poetry split the graph at 3.14 in the first place.
torch = ">=2.10"
torchvision = ">=0.25"
tqdm = "*"

[tool.poetry.group.dev.dependencies]
ipdb = "*"
mypy = "*"
pre-commit = "*"
pylint = "*"
pytest = "*"
ruff = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# TODO: pstefanou12@ - port delphi/stats/ to pydantic configs, then drop this.
# stats/ still passes helpers.Parameters (a plain class) into delphi.__init__,
# which has been dict-only with a TypeError guard since e3c37f7. Several call
# sites are also stale: truncated_lqr.py and tests/test_utils.py call
# TruncatedLinearRegression(phi, args, noise_var, ...) against an
# (args, phi, alpha, ...) signature, and the ridge/elastic-net fits call
# Trainer(...) without the now-required logger. These are real runtime
# failures, not typing noise, so they need the port rather than annotations.
module = [
    # TODO: pstefanou12@ - these two wrappers cannot run, independently
    # of the config port. TruncatedLinearRegression never sets
    # self.model (it uses self.weight), yet both read
    # trunc_*.model.weight; their inner estimators call
    # super().__init__(args, train_loader), passing the loader as phi
    # and omitting the required alpha; and calc_emp_model references
    # self.X / self.y, which nothing defines. Neither module has any
    # test. Fixing this needs the estimator's intent, not annotations.
    "delphi.stats.truncated_elastic_net_regression",
    "delphi.stats.truncated_ridge_regression",
]
ignore_errors = true

[[tool.mypy.overrides]]
# TODO: pstefanou12@ - revisit the generic/config typing of
# TruncatedExponentialFamilyDistribution, then drop this. configs._ConfigT is
# bound to TrainerConfig while this module reads fields declared only on
# TruncatedExponentialFamilyDistributionConfig (num_samples, eps, batch_size,
# min_radius, max_phases, rate, max_radius, project).
module = "delphi.truncated.distributions.truncated_exponential_family_distributions"
ignore_errors = true
